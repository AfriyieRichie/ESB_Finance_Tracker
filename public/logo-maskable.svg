<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>MiAhorro Pocket</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#143323"/>
      <stop offset="1" stop-color="#0b1712"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe082"/>
      <stop offset="1" stop-color="#f2a516"/>
    </linearGradient>
    <linearGradient id="pocket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2bf08a"/>
      <stop offset="1" stop-color="#00a854"/>
    </linearGradient>
  </defs>

  <!-- Tile -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(256 256) scale(0.82) translate(-256 -256)">

  <!-- Coin peeking out of the pocket -->
  <circle cx="256" cy="196" r="94" fill="url(#coin)"/>
  <circle cx="256" cy="196" r="72" fill="none" stroke="#c98a12" stroke-width="10" opacity="0.55"/>
  <!-- Growth arrow on the coin -->
  <path d="M256 150 L292 190 H270 V232 H242 V190 H220 Z" fill="#b97a0c" opacity="0.85"/>

  <!-- Pocket (jeans back-pocket shape) -->
  <path d="M118 236 H394 V338 Q394 366 368 380 L272 430 Q256 438 240 430 L144 380 Q118 366 118 338 Z"
        fill="url(#pocket)"/>
  <!-- Hem and stitching -->
  <path d="M118 236 H394 V262 H118 Z" fill="#000" opacity="0.12"/>
  <path d="M138 276 H374 V334 Q374 352 357 361 L268 407 Q256 413 244 407 L155 361 Q138 352 138 334 Z"
        fill="none" stroke="#0b1712" stroke-opacity="0.45" stroke-width="6"
        stroke-dasharray="14 11" stroke-linecap="round"/>
  <line x1="136" y1="250" x2="376" y2="250" stroke="#0b1712" stroke-opacity="0.45"
        stroke-width="6" stroke-dasharray="14 11" stroke-linecap="round"/>
  </g>
</svg>
